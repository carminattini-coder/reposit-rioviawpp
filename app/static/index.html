<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistente de Documentos</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }
  header { background: #1a73e8; color: white; padding: 16px 24px; font-size: 18px; font-weight: 600; }
  #chat { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 75%; padding: 12px 16px; border-radius: 16px; line-height: 1.5; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #1a73e8; color: white; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: white; color: #333; border-bottom-left-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .typing { color: #999; font-style: italic; }
  form { display: flex; gap: 8px; padding: 16px 24px; background: white; border-top: 1px solid #e0e0e0; }
  input { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 24px; font-size: 15px; outline: none; }
  input:focus { border-color: #1a73e8; }
  button { padding: 12px 24px; background: #1a73e8; color: white; border: none; border-radius: 24px; font-size: 15px; cursor: pointer; }
  button:hover { background: #1558b0; }
  button:disabled { background: #aaa; cursor: default; }
</style>
</head>
<body>
<header>Assistente de Documentos</header>
<div id="chat">
  <div class="msg bot">Olá! Faça uma pergunta sobre os documentos disponíveis.</div>
</div>
<form id="form">
  <input id="input" type="text" placeholder="Digite sua pergunta..." autocomplete="off" required>
  <button id="btn" type="submit">Enviar</button>
</form>
<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const btn = document.getElementById('btn');

  function addMsg(text, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    addMsg(q, 'user');
    input.value = '';
    btn.disabled = true;
    const typing = addMsg('Pensando...', 'bot typing');

    try {
      const res = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q })
      });
      const data = await res.json();
      typing.textContent = data.answer || data.detail || 'Erro ao obter resposta.';
      typing.classList.remove('typing');
    } catch {
      typing.textContent = 'Erro de conexão.';
      typing.classList.remove('typing');
    }
    btn.disabled = false;
    input.focus();
  });
</script>
</body>
</html>
